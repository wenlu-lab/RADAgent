[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rad-agent"
version = "0.1.0"
description = "Open-source agentic runtime for the RAD bioinformatics pipeline"
requires-python = ">=3.11"
dependencies = [
    "transformers>=4.55",
    "torch>=2.1",
    "accelerate>=0.30",
    "huggingface_hub>=0.27",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "click>=8.1",
    "textual>=0.80",
    "rich>=13",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-timeout>=2.3",
]

[project.scripts]
rad-agent = "rad.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rad*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
